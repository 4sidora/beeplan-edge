; BeePlan — конечное устройство в улье (ESP32 / ESP32-C3, ESP-NOW TX)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
  -D BEEPLAN_PROTO_VERSION=1
lib_deps =
  bblanchon/ArduinoJson@^7

[env:esp32dev]
board = esp32dev

; ESP32-C3 + CH340/CH343 (CORE-ESP32-C3) — UART0 @ GPIO20/21, flash DIO
[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_rts = 0
monitor_dtr = 0
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0

; ESP32-C3 нативный USB
[env:esp32c3-usb]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
