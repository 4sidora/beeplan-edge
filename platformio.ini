; BeePlan — конечное устройство в улье (ESP32, ESP-NOW TX)

[platformio]
default_envs = ttgo-t-energy

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
  -D BEEPLAN_PROTO_VERSION=2
lib_deps =
  bblanchon/ArduinoJson@^7

[env:esp32dev]
board = esp32dev

; LILYGO TTGO T-Energy T18 V3.0 — ESP32-WROVER, 18650, батарея на GPIO35
[env:ttgo-t-energy]
extends = env:esp32dev
build_flags =
  ${env.build_flags}
  -D BEEPLAN_BOARD_T_ENERGY=1
