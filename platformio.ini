; BeePlan — конечное устройство в улье (ESP32, ESP-NOW TX)
; Плата: подставьте свою (LILYGO T-Energy и др.) — см. https://docs.platformio.org/

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D BEEPLAN_PROTO_VERSION=1
lib_deps =
  bblanchon/ArduinoJson@^7
